# Postgres del plano de control. La ejecucion NO vive aca: el kanban de Hermes
# es SQLite y es suyo (ARQUITECTURA.md §13).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orquester
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orquester-local}
      POSTGRES_DB: orquester
    ports: ["5433:5432"]        # 5433 para no chocar con un Postgres del sistema
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orquester"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
