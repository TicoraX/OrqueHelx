name: CI

# The plugin's suite against a real Hermes (no mocks of the core).
# - minimum version declared in orquehelx/plugin.yaml: blocks the merge.
# - Hermes main: early warning of upstream breakage; blocks only on the weekly run.
# Flow: branch -> PR to develop -> PR from develop to master -> tag. master is the default branch:
# `hermes plugins install` clones it, so it only gets what already went through develop.
on:
  push:
    branches: [master, develop]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / hermes ${{ matrix.hermes }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: ${{ matrix.hermes == 'main' && github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        hermes: [v2026.9.24, main]
        include:
          # main declares its dependencies only for Python >= 3.14 (runtime managed by its bootstrap).
          - hermes: v2026.9.24
            python: "3.11"
          - hermes: main
            python: "3.14"
          # plugin.yaml declares macos: it is tested only against the minimum version.
          - os: macos-latest
            hermes: v2026.9.24
            python: "3.11"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Hermes ${{ matrix.hermes }}
        run: |
          git config --global core.longpaths true
          git clone --quiet --depth 1 --branch "${{ matrix.hermes }}" https://github.com/NousResearch/hermes-agent "$RUNNER_TEMP/hermes"
          uv venv --python "${{ matrix.python }}" .venv
          uv pip install --python .venv -e "$RUNNER_TEMP/hermes" pytest
      - name: Tests
        run: |
          PY=.venv/bin/python; [ -x "$PY" ] || PY=.venv/Scripts/python.exe
          "$PY" -m pytest -q -p no:cacheprovider tests

  ui:
    # The dashboard UI: checks, tests and build. The dist is committed (whoever installs needs no Node),
    # so the CI build has to match the repo's.
    name: ui
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: The committed dist is the build's
        # ls-files: the dist must be tracked (a .gitignore once hid it and the check passed anyway).
        # porcelain --ignored: sees changed, new and ignored files (an asset the build added).
        run: |
          git ls-files --error-unmatch ../orquehelx/dashboard/dist/index.js ../orquehelx/dashboard/dist/style.css
          changes=$(git status --porcelain --ignored -- ../orquehelx/dashboard/dist)
          if [ -n "$changes" ]; then echo "$changes"; echo "::error::stale dist: run npm run build in ui/ and commit"; exit 1; fi
