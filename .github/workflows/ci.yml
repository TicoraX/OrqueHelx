name: CI

# The plugin's suite against a real Hermes (no mocks of the core).
# - minimum version declared in orquehelx/plugin.yaml: blocks the merge.
# - Hermes main: early warning of upstream breakage; blocks only on the weekly run.
# Flow: branch -> PR to develop -> PR from develop to master -> tag. master is the default branch:
# `hermes plugins install` clones it, so it only gets what already went through develop.
on:
  push:
    branches: [master, develop]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / hermes ${{ matrix.hermes }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: ${{ matrix.hermes == 'main' && github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        hermes: [v0.22.0, main]
        include:
          # plugin.yaml declares macos: it is tested only against the minimum version.
          - os: macos-latest
            hermes: v0.22.0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Hermes ${{ matrix.hermes }}
        run: |
          git config --global core.longpaths true
          git clone --quiet --depth 1 --branch "${{ matrix.hermes }}" https://github.com/NousResearch/hermes-agent "$RUNNER_TEMP/hermes"
          # Since v0.22.0 Hermes declares its dependencies only for Python >= 3.14.
          uv venv --python 3.14 .venv
          # From Hermes' own directory, so uv applies its [tool.uv] override-dependencies
          # (e.g. Pillow 13 over browser-harness' pin); from outside, main is unresolvable.
          (cd "$RUNNER_TEMP/hermes" && uv pip install --python "$GITHUB_WORKSPACE/.venv" -e . pytest)
      - name: Tests
        run: |
          PY=.venv/bin/python; [ -x "$PY" ] || PY=.venv/Scripts/python.exe
          "$PY" -m pytest -q -p no:cacheprovider tests

