name: CI Suite

on:
  push:
    branches: [ master, main, "feat/*" ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Configurar Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Validar integridad de plantillas y sintaxis
        run: |
          uv run --python ${{ matrix.python-version }} --with jsonschema --with pyyaml python cli.py plantillas
          uv run --python ${{ matrix.python-version }} --with pyflakes pyflakes compiler dispatcher ui tests

      - name: Ejecutar suite de pruebas completa
        run: |
          uv run --python ${{ matrix.python-version }} --with jsonschema --with pyyaml --with pyflakes python tests/correr.py
