name: CI

# Suite del plugin contra Hermes real (sin mocks del core).
# - version minima declarada en orquehelx/plugin.yaml: bloquea el merge.
# - main de Hermes: aviso temprano de roturas upstream; bloquea solo en la corrida semanal.
on:
  push:
    branches: [master, overhaul]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / hermes ${{ matrix.hermes }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: ${{ matrix.hermes == 'main' && github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        hermes: [v2026.9.24, main]
        include:
          # main declara sus dependencias solo para Python >= 3.14 (runtime gestionado por su bootstrap).
          - hermes: v2026.9.24
            python: "3.11"
          - hermes: main
            python: "3.14"
          # plugin.yaml declara macos: se prueba solo contra la version minima.
          - os: macos-latest
            hermes: v2026.9.24
            python: "3.11"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Hermes ${{ matrix.hermes }}
        run: |
          git config --global core.longpaths true
          git clone --quiet --depth 1 --branch "${{ matrix.hermes }}" https://github.com/NousResearch/hermes-agent "$RUNNER_TEMP/hermes"
          uv venv --python "${{ matrix.python }}" .venv
          uv pip install --python .venv -e "$RUNNER_TEMP/hermes" pytest
      - name: Tests
        run: |
          PY=.venv/bin/python; [ -x "$PY" ] || PY=.venv/Scripts/python.exe
          "$PY" -m pytest -q -p no:cacheprovider tests

  ui:
    # La UI del dashboard: checks, tests y build. El dist va commiteado (quien instala no necesita Node),
    # asi que el build de CI tiene que coincidir con el del repo.
    name: ui
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: El dist commiteado es el del build
        # ls-files: el dist tiene que estar trackeado (un .gitignore lo escondio una vez y el chequeo paso igual).
        # porcelain --ignored: ve archivos cambiados, nuevos e ignorados (un asset que el build agrego).
        run: |
          git ls-files --error-unmatch ../orquehelx/dashboard/dist/index.js ../orquehelx/dashboard/dist/style.css
          cambios=$(git status --porcelain --ignored -- ../orquehelx/dashboard/dist)
          if [ -n "$cambios" ]; then echo "$cambios"; echo "::error::dist desactualizado: corre npm run build en ui/ y commitea"; exit 1; fi
