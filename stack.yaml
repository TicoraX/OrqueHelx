# Para PortMaster. `sh arrancar.sh` sigue funcionando igual y es lo que usa la
# terminal; esto es para arrancar ORQUESTER desde la interfaz de PortMaster
# junto al resto de los proyectos.
#
# Lo que arrancar.sh hace y esto no: agregar `$LOCALAPPDATA/agy/bin` al PATH y
# buscar el binario de Hermes fuera del PATH. Eso hace falta para los nodos
# `runtime: agy` y `runtime: hermes`, no para levantar el Studio. Si los vas a
# usar, arranca con arrancar.sh.

name: orquester

services:
  studio:
    # El motor y el Studio, que es lo que `sh arrancar.sh` sin argumentos levanta.
    command: uv run --python 3.11 --with jsonschema python ui/server.py 8765
    port: 8765
    env_file: [.env]
    # La cascara HTML se sirve sin token a proposito, pero todo /api lo exige:
    # abrir la raiz pelada da una pagina que se ve bien y falla en cada llamada.
    # El token sale del .env que escribe arrancar.sh.
    url: http://127.0.0.1:8765/?token=${ORQUESTER_TOKEN}

  db:
    # Postgres es del plano de control multiusuario, no del motor. Por eso no
    # esta en `default` ni en el `needs` del Studio: levantarlo por reflejo seria
    # arrancar una base que el flujo normal no toca.
    command: docker compose up -d db
    port: 5433
    detached: true
    stop: docker compose stop db

  api:
    command: node dist/main.js
    cwd: apps/api
    port: 3000
    needs: [db]
    env:
      PORT: "3000"
      DATABASE_URL: postgresql://orquester:orquester-local@localhost:5433/orquester?schema=public
      ORQUESTER_ENGINE_URL: http://127.0.0.1:8765

# Sin perfil arranca solo el Studio, igual que `sh arrancar.sh` sin argumentos.
default: [studio]

profiles:
  multi: [studio, api]   # arrastra db, que es dependencia de api
